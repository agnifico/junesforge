<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Mise · Concept by Junesforge</title>
<meta name="description" content="A concept web app for small kitchens: onboarding, orders, stock alerts and prep lists. Designed and built by Junesforge." />
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&display=swap" rel="stylesheet" />
<style>
	:root {
		--bg: #efefec;
		--card: #ffffff;
		--ink: #151515;
		--ink-2: #2a2a2a;
		--muted: #6b6b66;
		--line: rgba(21, 21, 21, 0.1);
		--sun: #ffb703;
		--sun-soft: #fff1cc;
		--red: #e5484d;
		--red-soft: #fde4e4;
		--green: #2f9e5f;
		--green-soft: #dcf2e4;
		--blue: #3e63dd;
		--blue-soft: #e1e8fb;
		--font: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
	}
	* { box-sizing: border-box; }
	body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
	button, input, select { font: inherit; color: inherit; }
	:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
	.wide { font-stretch: 118%; }
	[hidden] { display: none !important; }

	.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 18px; border-radius: 10px; border: 0; font-weight: 700; cursor: pointer; transition: background .15s, transform .1s, box-shadow .15s; }
	.btn:active { transform: translateY(1px); }
	.btn-sun { background: var(--sun); color: var(--ink); }
	.btn-sun:hover { background: #ffc633; }
	.btn-ink { background: var(--ink); color: #fff; }
	.btn-ink:hover { background: #333; }
	.btn-line { background: var(--card); box-shadow: inset 0 0 0 1px var(--line); }
	.btn-line:hover { box-shadow: inset 0 0 0 1px var(--ink); }
	.btn-sm { padding: 8px 12px; font-size: 13.5px; border-radius: 8px; }
	.btn[disabled] { opacity: .35; pointer-events: none; }

	.logo { display: flex; align-items: center; gap: 9px; font-weight: 900; font-size: 22px; font-stretch: 120%; letter-spacing: -.02em; }
	.logo i { width: 26px; height: 26px; border-radius: 8px; background: var(--sun); display: grid; place-items: center; font-style: normal; }
	.logo i::before { content: ''; width: 10px; height: 10px; border-radius: 50%; border: 3px solid var(--ink); }

	/* ================= onboarding ================= */
	.ob { min-height: 100dvh; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
	.ob-l { display: flex; flex-direction: column; padding: 32px clamp(24px, 5vw, 72px); }
	.ob-top { display: flex; align-items: center; justify-content: space-between; }
	.skip { border: 0; background: none; color: var(--muted); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
	.ob-prog { margin-top: 48px; display: flex; align-items: center; gap: 14px; font-size: 13px; font-weight: 700; color: var(--muted); }
	.ob-prog .track { flex: 1; max-width: 220px; height: 5px; border-radius: 5px; background: var(--line); overflow: hidden; }
	.ob-prog .track i { display: block; height: 100%; background: var(--ink); border-radius: 5px; transition: width .35s; }
	.ob-main { flex: 1; padding: 28px 0; max-width: 560px; }
	.ob-main h1 { margin: 0; font-size: clamp(34px, 4vw, 52px); line-height: 1; font-weight: 800; font-stretch: 112%; letter-spacing: -.035em; }
	.ob-main .sub { margin: 14px 0 28px; color: var(--muted); font-size: 17px; max-width: 44ch; }
	.lbl { display: block; font-weight: 700; font-size: 13.5px; margin-bottom: 8px; }
	.inp { width: 100%; padding: 16px 18px; border-radius: 12px; border: 0; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); font-size: 18px; font-weight: 600; }
	.inp:focus { outline: none; box-shadow: inset 0 0 0 2px var(--ink); }
	.chips { display: flex; flex-wrap: wrap; gap: 8px; }
	.chip { padding: 11px 16px; border-radius: 999px; border: 0; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); font-weight: 600; cursor: pointer; transition: box-shadow .15s, background .15s; }
	.chip:hover { box-shadow: inset 0 0 0 1px var(--ink); }
	.chip[aria-pressed="true"] { background: var(--ink); color: #fff; box-shadow: none; }
	.chip[aria-pressed="true"]::before { content: '✓ '; }
	.types { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
	.type { text-align: left; padding: 18px; border-radius: 14px; border: 0; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); cursor: pointer; }
	.type b { display: block; font-size: 17px; }
	.type span { font-size: 13.5px; color: var(--muted); }
	.type[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--ink); background: var(--sun-soft); }
	.add { display: flex; gap: 8px; margin-top: 14px; }
	.add .inp { font-size: 15px; padding: 12px 14px; }
	.srow { display: grid; grid-template-columns: 1fr auto auto; gap: 18px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
	.srow:first-of-type { border-top: 1px solid var(--line); }
	.srow b { font-size: 15.5px; }
	.srow small { display: block; color: var(--muted); font-size: 12.5px; }
	.step { display: flex; align-items: center; gap: 4px; background: var(--card); border-radius: 10px; box-shadow: inset 0 0 0 1px var(--line); padding: 3px; }
	.step button { width: 28px; height: 28px; border: 0; border-radius: 7px; background: none; cursor: pointer; font-weight: 800; font-size: 16px; }
	.step button:hover { background: var(--bg); }
	.step span { min-width: 44px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 14px; }
	.colh { display: grid; grid-template-columns: 1fr auto auto; gap: 18px; font-size: 12px; font-weight: 700; color: var(--muted); padding-bottom: 8px; }
	.colh span:nth-child(2), .colh span:nth-child(3) { width: 126px; text-align: center; }
	.tg { display: flex; align-items: center; gap: 16px; padding: 18px; border-radius: 14px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); margin-bottom: 10px; }
	.tg .t { flex: 1; }
	.tg .t b { display: block; font-size: 16px; }
	.tg .t span { color: var(--muted); font-size: 13.5px; }
	.sw { position: relative; width: 46px; height: 28px; border-radius: 999px; border: 0; background: #d5d5d0; cursor: pointer; transition: background .2s; flex: 0 0 auto; }
	.sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .2); transition: transform .2s; }
	.sw[aria-checked="true"] { background: var(--green); }
	.sw[aria-checked="true"]::after { transform: translateX(18px); }
	.sel { padding: 8px 10px; border-radius: 8px; border: 0; box-shadow: inset 0 0 0 1px var(--line); background: var(--bg); font-weight: 700; }
	.ob-foot { display: flex; gap: 10px; padding-top: 18px; border-top: 1px solid var(--line); max-width: 560px; }
	.ob-foot .btn-ink { flex: 1; padding: 15px; font-size: 16px; }

	.ob-r { background: var(--ink); color: #fff; padding: 32px; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; overflow: hidden; }
	.ob-r::before { content: ''; position: absolute; inset: 0; background-image: radial-gradient(rgba(255, 255, 255, .08) 1px, transparent 1px); background-size: 18px 18px; }
	.ob-r .cap { position: relative; font-size: 13px; color: #9a9a94; font-weight: 600; margin-bottom: 14px; }
	.pv { position: relative; width: min(420px, 100%); background: var(--card); color: var(--ink); border-radius: 18px; padding: 22px; box-shadow: 0 40px 80px -30px rgba(0, 0, 0, .7); }
	.pv-h { display: flex; align-items: center; gap: 12px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
	.pv-av { width: 44px; height: 44px; border-radius: 12px; background: var(--sun); display: grid; place-items: center; font-weight: 900; font-size: 18px; font-stretch: 120%; }
	.pv-h b { display: block; font-size: 18px; font-stretch: 110%; }
	.pv-h span { font-size: 13px; color: var(--muted); }
	.pv-sec { padding-top: 14px; }
	.pv-sec h4 { margin: 0 0 8px; font-size: 12px; color: var(--muted); font-weight: 700; }
	.pv-chips { display: flex; flex-wrap: wrap; gap: 6px; }
	.pv-chips span { font-size: 12.5px; font-weight: 600; padding: 5px 9px; border-radius: 7px; background: var(--bg); }
	.pv-empty { font-size: 13px; color: #b0b0aa; }
	.pv-row { display: flex; justify-content: space-between; align-items: center; font-size: 13.5px; padding: 6px 0; }
	.pv-bar { flex: 0 0 90px; height: 6px; border-radius: 6px; background: var(--bg); overflow: hidden; margin-left: 12px; }
	.pv-bar i { display: block; height: 100%; background: var(--green); }
	.pop { animation: pop .35s ease; }
	@keyframes pop { 50% { transform: scale(1.04); } }
	@media (max-width: 900px) { .ob { grid-template-columns: 1fr; } .ob-r { display: none; } }

	/* ================= dashboard ================= */
	.app { min-height: 100dvh; display: grid; grid-template-columns: 232px minmax(0, 1fr); }
	.side { background: var(--card); border-right: 1px solid var(--line); padding: 22px 14px; display: flex; flex-direction: column; gap: 6px; position: sticky; top: 0; height: 100dvh; }
	.side .logo { padding: 0 8px 18px; }
	.kitchen { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px; background: var(--bg); margin-bottom: 12px; }
	.kitchen .pv-av { width: 34px; height: 34px; font-size: 14px; border-radius: 9px; }
	.kitchen b { display: block; font-size: 14px; line-height: 1.2; }
	.kitchen span { font-size: 12px; color: var(--muted); }
	.nav-i { display: flex; align-items: center; gap: 11px; width: 100%; padding: 11px 12px; border: 0; border-radius: 10px; background: none; cursor: pointer; font-weight: 600; color: var(--muted); text-align: left; }
	.nav-i svg { width: 19px; height: 19px; flex: 0 0 auto; }
	.nav-i:hover { background: var(--bg); color: var(--ink); }
	.nav-i[aria-current="page"] { background: var(--ink); color: #fff; }
	.nav-i .ct { margin-left: auto; font-size: 11.5px; font-weight: 800; padding: 2px 7px; border-radius: 999px; background: var(--red); color: #fff; }
	.side .foot { margin-top: auto; font-size: 12px; color: var(--muted); padding: 10px; }
	.side .foot a { color: inherit; font-weight: 700; }

	.main { padding: 26px clamp(18px, 3vw, 36px) 60px; min-width: 0; }
	.top { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-bottom: 24px; }
	.top h1 { margin: 0; font-size: 30px; font-weight: 800; font-stretch: 112%; letter-spacing: -.03em; line-height: 1.05; }
	.top .date { color: var(--muted); font-size: 14px; margin-top: 4px; }
	.top .grow { flex: 1; }
	.search { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 10px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); color: var(--muted); width: 240px; }
	.search input { border: 0; outline: 0; background: none; width: 100%; }

	.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
	.kpi { background: var(--card); border-radius: 14px; padding: 16px 18px; box-shadow: inset 0 0 0 1px var(--line); }
	.kpi span { font-size: 13px; color: var(--muted); font-weight: 600; }
	.kpi b { display: block; font-size: 30px; font-weight: 800; font-stretch: 110%; letter-spacing: -.03em; margin-top: 4px; font-variant-numeric: tabular-nums; }
	.kpi small { font-size: 12.5px; font-weight: 700; }
	.up { color: var(--green); } .dn { color: var(--red); }
	.kpi.alert { background: var(--red-soft); box-shadow: none; }

	.grid { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 16px; align-items: start; }
	.col { display: grid; gap: 16px; }
	.card { background: var(--card); border-radius: 16px; box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
	.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
	.card-h h2 { margin: 0; font-size: 16.5px; font-weight: 800; font-stretch: 108%; }
	.card-h span { font-size: 13px; color: var(--muted); }

	.ord { display: grid; grid-template-columns: 62px minmax(0, 1fr) 82px 110px; gap: 12px; align-items: center; padding: 12px 18px; border-bottom: 1px solid var(--line); font-size: 14px; }
	.ord:last-child { border-bottom: 0; }
	.ord .id { font-weight: 800; font-variant-numeric: tabular-nums; }
	.ord .items b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	.ord .items span { font-size: 12.5px; color: var(--muted); }
	.ord .amt { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
	.pill { justify-self: end; display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; border: 0; font-size: 12.5px; font-weight: 800; cursor: pointer; white-space: nowrap; }
	.pill::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
	.pill[data-s="New"] { background: var(--sun-soft); color: #946400; }
	.pill[data-s="Cooking"] { background: var(--blue-soft); color: var(--blue); }
	.pill[data-s="Ready"] { background: var(--green-soft); color: var(--green); }
	.pill[data-s="Picked up"] { background: var(--bg); color: var(--muted); cursor: default; }
	.pill:not([data-s="Picked up"]):hover { box-shadow: inset 0 0 0 1.5px currentColor; }
	.pill:not([data-s="Picked up"])::after { content: '→'; }

	.chart { display: flex; align-items: flex-end; gap: 6px; height: 120px; padding: 18px 18px 8px; }
	.chart div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
	.chart i { width: 100%; border-radius: 5px 5px 2px 2px; background: #deded9; transition: height .4s; }
	.chart div.now i { background: var(--sun); }
	.chart span { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

	.low { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--line); font-size: 14px; }
	.low:last-child { border-bottom: 0; }
	.low .t { flex: 1; min-width: 0; }
	.low .t b { display: block; }
	.low .t span { font-size: 12.5px; color: var(--red); font-weight: 600; }
	.low.done .t span { color: var(--green); }
	.okmsg { padding: 22px 18px; color: var(--muted); font-size: 14px; }

	.prog { height: 6px; background: var(--bg); border-radius: 6px; overflow: hidden; margin: 0 18px 4px; }
	.prog i { display: block; height: 100%; background: var(--green); transition: width .3s; }
	.prep { display: flex; align-items: center; gap: 12px; padding: 11px 18px; cursor: pointer; font-size: 14px; user-select: none; }
	.prep:hover { background: #fafaf8; }
	.prep input { appearance: none; width: 20px; height: 20px; border-radius: 6px; box-shadow: inset 0 0 0 1.5px #c8c8c2; margin: 0; cursor: pointer; display: grid; place-items: center; flex: 0 0 auto; }
	.prep input:checked { background: var(--ink); box-shadow: none; }
	.prep input:checked::after { content: ''; width: 9px; height: 5px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(-45deg) translate(1px, -1px); }
	.prep .t { flex: 1; }
	.prep.done .t { color: var(--muted); text-decoration: line-through; }
	.prep small { font-size: 12px; color: var(--muted); padding: 3px 8px; border-radius: 6px; background: var(--bg); }

	.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
	.filters .chip { padding: 8px 13px; font-size: 13.5px; }
	.filters .chip[aria-pressed="true"]::before { content: none; }

	.st { display: grid; grid-template-columns: minmax(0, 1.2fr) 150px minmax(0, 1fr) 90px; gap: 16px; align-items: center; padding: 12px 18px; border-bottom: 1px solid var(--line); font-size: 14px; }
	.st:last-child { border-bottom: 0; }
	.st.h { font-size: 12px; font-weight: 700; color: var(--muted); padding-block: 10px; }
	.lvl { height: 8px; border-radius: 8px; background: var(--bg); overflow: hidden; }
	.lvl i { display: block; height: 100%; border-radius: 8px; }
	.badge { justify-self: end; font-size: 12px; font-weight: 800; padding: 4px 9px; border-radius: 999px; }
	.badge.ok { background: var(--green-soft); color: var(--green); }
	.badge.lo { background: var(--red-soft); color: var(--red); }

	@media (max-width: 1100px) { .grid { grid-template-columns: 1fr; } }
	@media (max-width: 820px) {
		.app { grid-template-columns: 1fr; }
		.side { position: fixed; top: auto; bottom: 0; left: 0; right: 0; height: auto; z-index: 20; flex-direction: row; justify-content: space-around; padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px)); border-right: 0; border-top: 1px solid var(--line); }
		.side .logo, .side .kitchen, .side .foot { display: none; }
		.nav-i { flex-direction: column; gap: 3px; font-size: 11px; padding: 8px 4px; width: auto; flex: 1; position: relative; }
		.nav-i .ct { position: absolute; top: 2px; right: 18%; margin: 0; }
		.main { padding-bottom: 100px; }
		.kpis { grid-template-columns: 1fr 1fr; }
		.search { display: none; }
		.ord { grid-template-columns: 52px minmax(0, 1fr) auto; }
		.ord .amt { display: none; }
		.st { grid-template-columns: minmax(0, 1fr) 130px 64px; }
		.st .lvl, .st.h span:nth-child(3) { display: none; }
	}

	.concept { position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 30; display: flex; align-items: center; gap: 8px; padding: 9px 14px 9px 10px; border-radius: 999px; background: #0e0e0e; color: #f4f4f1; font-size: 13px; font-weight: 600; text-decoration: none; box-shadow: 0 8px 24px -10px rgba(0, 0, 0, .5); }
	.concept i { width: 8px; height: 8px; border-radius: 50%; background: #22c58b; }
	/* In the app the sidebar carries the credit; on a phone it moves to the corner. */
	body.in-app .concept { display: none; }
	@media (max-width: 820px) { body.in-app .concept { display: flex; top: calc(12px + env(safe-area-inset-top, 0px)); bottom: auto; left: auto; right: 12px; } }
	.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); z-index: 60; background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; }
	.toast.show { opacity: 1; transform: translate(-50%, 0); }
	@media (max-width: 820px) { .toast { bottom: calc(86px + env(safe-area-inset-bottom, 0px)); } }
	@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 1ms !important; animation-duration: 1ms !important; } }
</style>
</head>
<body>
<div id="root"></div>
<a class="concept" href="https://junesforge.com" target="_top"><i></i>Concept by Junesforge</a>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
	/* ---------------- data ---------------- */
	const TYPES = [
		{ id: 'cloud', name: 'Cloud kitchen', blurb: 'Delivery only' },
		{ id: 'cafe', name: 'Café', blurb: 'Coffee and small plates' },
		{ id: 'bakery', name: 'Bakery', blurb: 'Bread, pastry, cakes' },
		{ id: 'rest', name: 'Restaurant', blurb: 'Dine-in and takeaway' }
	];
	const MENU = {
		cloud: ['Butter chicken', 'Dal makhani', 'Paneer tikka', 'Jeera rice', 'Garlic naan', 'Chicken biryani'],
		cafe: ['Cappuccino', 'Cold brew', 'Avocado toast', 'Croissant', 'Banana bread', 'Iced latte'],
		bakery: ['Sourdough loaf', 'Croissant', 'Cinnamon roll', 'Chocolate cake', 'Baguette', 'Focaccia'],
		rest: ['Masala dosa', 'Idli plate', 'Filter coffee', 'Veg thali', 'Paneer butter masala', 'Gulab jamun']
	};
	const USES = {
		'Butter chicken': ['Chicken', 'Butter', 'Cream', 'Tomatoes', 'Spice mix'],
		'Dal makhani': ['Black lentils', 'Butter', 'Cream'],
		'Paneer tikka': ['Paneer', 'Yogurt', 'Spice mix', 'Onions'],
		'Jeera rice': ['Basmati rice', 'Ghee'],
		'Garlic naan': ['Flour', 'Garlic', 'Butter', 'Yogurt'],
		'Chicken biryani': ['Chicken', 'Basmati rice', 'Onions', 'Yogurt', 'Ghee'],
		Cappuccino: ['Coffee beans', 'Milk'],
		'Cold brew': ['Coffee beans'],
		'Avocado toast': ['Avocados', 'Bread', 'Eggs'],
		Croissant: ['Flour', 'Butter', 'Yeast'],
		'Banana bread': ['Bananas', 'Flour', 'Sugar', 'Eggs'],
		'Iced latte': ['Coffee beans', 'Milk'],
		'Sourdough loaf': ['Flour', 'Sourdough starter'],
		'Cinnamon roll': ['Flour', 'Butter', 'Sugar', 'Cinnamon'],
		'Chocolate cake': ['Flour', 'Chocolate', 'Eggs', 'Sugar', 'Butter'],
		Baguette: ['Flour', 'Yeast'],
		Focaccia: ['Flour', 'Olive oil', 'Yeast'],
		'Masala dosa': ['Rice batter', 'Potatoes', 'Onions'],
		'Idli plate': ['Rice batter'],
		'Filter coffee': ['Coffee beans', 'Milk', 'Sugar'],
		'Veg thali': ['Basmati rice', 'Vegetables', 'Black lentils', 'Yogurt'],
		'Paneer butter masala': ['Paneer', 'Butter', 'Cream', 'Tomatoes'],
		'Gulab jamun': ['Milk', 'Sugar', 'Ghee']
	};
	// name: [unit, starting stock, warn below]
	const INGR = {
		Chicken: ['kg', 12, 5], Paneer: ['kg', 6, 3], Butter: ['kg', 4, 2], Cream: ['L', 5, 2], Tomatoes: ['kg', 10, 4],
		'Spice mix': ['kg', 3, 1], 'Black lentils': ['kg', 8, 3], Yogurt: ['kg', 6, 3], Onions: ['kg', 15, 6],
		'Basmati rice': ['kg', 25, 10], Ghee: ['kg', 3, 1], Flour: ['kg', 30, 10], Garlic: ['kg', 2, 1],
		'Coffee beans': ['kg', 5, 2], Milk: ['L', 20, 8], Avocados: ['pcs', 18, 8], Bread: ['loaves', 10, 4],
		Eggs: ['trays', 6, 2], Yeast: ['packs', 6, 2], Bananas: ['kg', 4, 2], Sugar: ['kg', 12, 4],
		'Sourdough starter': ['jars', 3, 1], Cinnamon: ['jars', 3, 1], Chocolate: ['kg', 3, 1], 'Olive oil': ['L', 4, 2],
		'Rice batter': ['L', 15, 6], Potatoes: ['kg', 12, 5], Vegetables: ['kg', 14, 6]
	};
	const PRICE = {
		'Butter chicken': 340, 'Dal makhani': 260, 'Paneer tikka': 290, 'Jeera rice': 160, 'Garlic naan': 70, 'Chicken biryani': 320,
		Cappuccino: 180, 'Cold brew': 220, 'Avocado toast': 340, Croissant: 160, 'Banana bread': 150, 'Iced latte': 210,
		'Sourdough loaf': 280, 'Cinnamon roll': 140, 'Chocolate cake': 520, Baguette: 160, Focaccia: 240,
		'Masala dosa': 120, 'Idli plate': 80, 'Filter coffee': 50, 'Veg thali': 240, 'Paneer butter masala': 280, 'Gulab jamun': 90
	};
	const PREP = {
		'Butter chicken': 'Marinate chicken for butter chicken', 'Dal makhani': 'Soak and pressure-cook dal', 'Paneer tikka': 'Cube and marinate paneer',
		'Jeera rice': 'Wash and soak rice', 'Garlic naan': 'Knead naan dough', 'Chicken biryani': 'Fry onions for biryani',
		Cappuccino: 'Dial in espresso grind', 'Cold brew': 'Start tomorrow\'s cold brew', 'Avocado toast': 'Check avocados for ripeness',
		Croissant: 'Laminate croissant dough', 'Banana bread': 'Bake two loaves of banana bread', 'Iced latte': 'Fill the ice bins',
		'Sourdough loaf': 'Feed the starter', 'Cinnamon roll': 'Proof cinnamon rolls', 'Chocolate cake': 'Bake cake sponges',
		Baguette: 'Shape baguettes', Focaccia: 'Dimple and proof focaccia', 'Masala dosa': 'Make potato masala',
		'Idli plate': 'Steam first batch of idli', 'Filter coffee': 'Brew decoction', 'Veg thali': 'Chop vegetables for thali',

	const STATION = (t) => /coffee|espresso|brew|ice|decoction/i.test(t) ? 'Bar' : /dough|proof|bake|laminate|shape|sponge|starter|dimple|knead/i.test(t) ? 'Bakery' : 'Line';
	const FLOW = ['New', 'Cooking', 'Ready', 'Picked up'];
	const CHANNEL = ['App', 'App', 'Counter', 'Phone', 'App'];

	const rupees = (n) => '₹' + Math.round(n).toLocaleString('en-IN');
	const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
	const initials = (s) => (s.trim().split(/\s+/).map((w) => w[0]).join('').slice(0, 2) || 'M').toUpperCase();
	function rng(seed) { let h = 2166136261; for (const c of seed) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return () => ((h = Math.imul(h ^ (h >>> 15), 2246822507) ^ Math.imul(h ^ (h >>> 13), 3266489909)) >>> 0) / 4294967296; }

	/* ---------------- state ---------------- */
	const S = {
		mode: 'ob', step: 0,
		name: '', type: null, menu: [], custom: [], stock: [],
		alerts: { low: true, prep: true, prepAt: '07:00', weekly: false },
		view: 'today', filter: 'All', orders: [], prepDone: {}, reordered: {}, nextId: 1041
	};
	const root = document.getElementById('root');

	function deriveStock() {
		const keep = Object.fromEntries(S.stock.map((s) => [s.name, s]));
		const names = [...new Set(S.menu.flatMap((d) => USES[d] || []))];
		S.stock = names.map((n) => keep[n] || { name: n, unit: INGR[n][0], qty: INGR[n][1], min: INGR[n][2] });
	}

	/* ---------------- onboarding ---------------- */
	const OB = [
		{ title: 'What\'s your kitchen called?', sub: 'This is what your team sees when they log in. You can change it later.', ok: () => S.name.trim().length > 1 && S.type },
		{ title: 'What do you make most?', sub: 'Pick at least three. We use these to suggest what to track and what to prep.', ok: () => S.menu.length + S.custom.length >= 3 },
		{ title: 'What\'s in the store room?', sub: 'We filled this in from your menu. Adjust what you have now, and when you want a warning.', ok: () => true },
		{ title: 'When should we nudge you?', sub: 'Mise sends alerts so nobody has to check the fridge at 11 at night.', ok: () => true }
	];

	function renderOB() {
		const st = OB[S.step];
		let body = '';
		if (S.step === 0) {
			body = `<label class="lbl" for="kName">Kitchen name</label>
				<input class="inp" id="kName" placeholder="e.g. Tandoor Lane" value="${esc(S.name)}" autocomplete="organization" />
				<div style="height:26px"></div><span class="lbl">What kind of kitchen?</span>
				<div class="types">${TYPES.map((t) => `<button class="type" aria-pressed="${S.type === t.id}" data-type="${t.id}"><b>${t.name}</b><span>${t.blurb}</span></button>`).join('')}</div>`;
		} else if (S.step === 1) {
			body = `<div class="chips">${MENU[S.type].map((d) => `<button class="chip" aria-pressed="${S.menu.includes(d)}" data-dish="${esc(d)}">${esc(d)}</button>`).join('')}
				${S.custom.map((d, k) => `<button class="chip" aria-pressed="true" data-custom="${k}">${esc(d)}</button>`).join('')}</div>
				<form class="add" id="addForm"><input class="inp" id="addInp" placeholder="Add something else" /><button class="btn btn-line">Add</button></form>`;
		} else if (S.step === 2) {
			body = S.stock.length
				? `<div class="colh"><span>Ingredient</span><span>In stock</span><span>Warn below</span></div>
					${S.stock.map((s, k) => `<div class="srow"><div><b>${esc(s.name)}</b><small>used in ${S.menu.filter((d) => (USES[d] || []).includes(s.name)).length} dishes</small></div>
					${stepper(k, 'qty', s)}${stepper(k, 'min', s)}</div>`).join('')}`
				: `<p class="sub">Nothing to track from your menu yet. You can add ingredients from the Stock page.</p>`;
		} else {
			const A = S.alerts;
			body = `<div class="tg"><div class="t"><b>Low-stock alerts</b><span>A WhatsApp message the moment anything drops below its line</span></div><button class="sw" role="switch" aria-checked="${A.low}" data-alert="low" aria-label="Low-stock alerts"></button></div>
				<div class="tg"><div class="t"><b>Morning prep list</b><span>Sent to the kitchen phone at <select class="sel" id="prepAt">${['06:00', '06:30', '07:00', '07:30', '08:00'].map((t) => `<option ${t === A.prepAt ? 'selected' : ''}>${t}</option>`).join('')}</select></span></div><button class="sw" role="switch" aria-checked="${A.prep}" data-alert="prep" aria-label="Morning prep list"></button></div>
				<div class="tg"><div class="t"><b>Weekly summary</b><span>Best sellers, waste and spend, every Monday</span></div><button class="sw" role="switch" aria-checked="${A.weekly}" data-alert="weekly" aria-label="Weekly summary"></button></div>`;
		}
		root.innerHTML = `<div class="ob">
			<div class="ob-l">
				<div class="ob-top"><span class="logo"><i></i>mise</span><button class="skip" data-demo>Skip to a demo kitchen</button></div>
				<div class="ob-prog">Step ${S.step + 1} of ${OB.length}<span class="track"><i style="width:${((S.step + 1) / OB.length) * 100}%"></i></span></div>
				<div class="ob-main"><h1>${st.title}</h1><p class="sub">${st.sub}</p>${body}</div>
				<div class="ob-foot">
					${S.step ? '<button class="btn btn-line" data-back>Back</button>' : ''}
					<button class="btn btn-ink" data-next ${st.ok() ? '' : 'disabled'}>${S.step === OB.length - 1 ? 'Open my kitchen →' : 'Continue'}</button>
				</div>
			</div>
			<div class="ob-r"><div class="cap">Your kitchen, as you build it</div>${preview()}</div>
		</div>`;
		if (S.step === 0) {
			const inp = document.getElementById('kName');
			inp.addEventListener('input', () => { S.name = inp.value; refreshOB(); });
		}
		if (S.step === 1) {
			document.getElementById('addForm').addEventListener('submit', (e) => {
				e.preventDefault();
				const v = document.getElementById('addInp').value.trim();
				if (v && !S.custom.includes(v) && !S.menu.includes(v)) { S.custom.push(v); renderOB(); document.getElementById('addInp').focus(); }
			});
		}
		if (S.step === 3) document.getElementById('prepAt').addEventListener('change', (e) => { S.alerts.prepAt = e.target.value; refreshOB(); });
	}
	/* Typing must not rebuild the input (it would drop focus), so only the
	   preview and the button are refreshed. */
	function refreshOB() {
		root.querySelector('.ob-r').innerHTML = `<div class="cap">Your kitchen, as you build it</div>${preview()}`;
		root.querySelector('[data-next]').disabled = !OB[S.step].ok();
	}
	function stepper(k, key, s) {
		return `<div class="step"><button data-step="${k}|${key}|-1" aria-label="Less ${esc(s.name)}">−</button><span>${s[key]} ${s.unit}</span><button data-step="${k}|${key}|1" aria-label="More ${esc(s.name)}">+</button></div>`;
	}
	function preview() {
		const t = TYPES.find((x) => x.id === S.type);
		const dishes = [...S.menu, ...S.custom];
		const A = S.alerts;
		const alerts = [A.low && 'Low stock on WhatsApp', A.prep && `Prep list at ${A.prepAt}`, A.weekly && 'Monday summary'].filter(Boolean);
		return `<div class="pv">
			<div class="pv-h"><div class="pv-av">${esc(initials(S.name || 'Mise'))}</div><div><b>${esc(S.name.trim() || 'Your kitchen')}</b><span>${t ? t.name : 'Kitchen type'}</span></div></div>
			<div class="pv-sec"><h4>Menu</h4>${dishes.length ? `<div class="pv-chips">${dishes.map((d) => `<span>${esc(d)}</span>`).join('')}</div>` : '<div class="pv-empty">Your dishes appear here</div>'}</div>
			<div class="pv-sec"><h4>Tracking</h4>${S.stock.length ? S.stock.slice(0, 5).map((s) => `<div class="pv-row"><span>${esc(s.name)}</span><span style="display:flex;align-items:center">${s.qty} ${s.unit}<span class="pv-bar"><i style="width:${Math.min(100, (s.qty / (s.min * 3)) * 100)}%;background:${s.qty <= s.min ? 'var(--red)' : 'var(--green)'}"></i></span></span></div>`).join('') + (S.stock.length > 5 ? `<div class="pv-empty">and ${S.stock.length - 5} more</div>` : '') : '<div class="pv-empty">Ingredients appear once you pick dishes</div>'}</div>
			<div class="pv-sec"><h4>Alerts</h4>${S.step >= 3 ? (alerts.length ? `<div class="pv-chips">${alerts.map((a) => `<span>${a}</span>`).join('')}</div>` : '<div class="pv-empty">All off</div>') : '<div class="pv-empty">Set in the last step</div>'}</div>
		</div>`;
	}

	/* ---------------- dashboard ---------------- */
	function seedKitchen() {
		const r = rng(S.name + S.type);
		const dishes = [...S.menu, ...S.custom];
		/* This morning's usage, so the dashboard has something to say. */
		S.stock.forEach((s, k) => { if (k % 3 === 1) s.qty = Math.max(0, s.min - 1 - Math.floor(r() * 2)); });
		S.orders = [];
		const now = new Date();
		for (let k = 0; k < 9; k++) {
			const n = 1 + Math.floor(r() * 3);
			const items = Array.from({ length: n }, () => dishes[Math.floor(r() * dishes.length)]);
			const t = new Date(now.getTime() - (9 - k) * (6 + Math.floor(r() * 9)) * 60000);
			S.orders.push({ id: S.nextId++, items, channel: CHANNEL[Math.floor(r() * CHANNEL.length)], at: t, status: FLOW[Math.min(3, Math.floor((9 - k) / 2.6))] });
		}
		S.orders.reverse();
		S.hours = Array.from({ length: 12 }, (_, k) => Math.round(2 + r() * 9 + (k === 4 || k === 9 ? 6 : 0)));
	}
	const total = (o) => o.items.reduce((a, d) => a + (PRICE[d] || 250), 0);
	const lowItems = () => S.stock.filter((s) => s.qty <= s.min);
	const prepList = () => [...S.menu, ...S.custom].map((d) => PREP[d] || `Mise en place for ${d}`);
	const fmtTime = (d) => d.toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' });
	const summarise = (items) => { const c = {}; items.forEach((i) => (c[i] = (c[i] || 0) + 1)); return Object.entries(c).map(([k, v]) => (v > 1 ? `${v}× ` : '') + k).join(', '); };

	const ICON = {
		today: '<path d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/>',
		orders: '<path d="M6 3h12l1 5H5zM5 8h14v12a1 1 0 01-1 1H6a1 1 0 01-1-1zM9 12h6"/>',
		stock: '<path d="M4 7l8-4 8 4v10l-8 4-8-4zM4 7l8 4 8-4M12 11v10"/>',
		prep: '<path d="M9 4h6M9 4a2 2 0 00-2 2H5v15h14V6h-2a2 2 0 00-2-2M8 12l2.5 2.5L16 9"/>',
		settings: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>'
	};
	const NAV = [['today', 'Today'], ['orders', 'Orders'], ['stock', 'Stock'], ['prep', 'Prep'], ['settings', 'Settings']];

	function renderApp() {
		const t = TYPES.find((x) => x.id === S.type);
		const hr = new Date().getHours();
		const greet = hr < 12 ? 'Good morning' : hr < 17 ? 'Good afternoon' : 'Good evening';
		const counts = { orders: S.orders.filter((o) => o.status === 'New').length, stock: lowItems().filter((s) => !S.reordered[s.name]).length };
		root.innerHTML = `<div class="app">
			<aside class="side">
				<span class="logo"><i></i>mise</span>
				<div class="kitchen"><div class="pv-av">${esc(initials(S.name))}</div><div><b>${esc(S.name)}</b><span>${t.name}</span></div></div>
				${NAV.map(([id, label]) => `<button class="nav-i" data-view="${id}" ${S.view === id ? 'aria-current="page"' : ''}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${ICON[id]}</svg>${label}${counts[id] ? `<span class="ct">${counts[id]}</span>` : ''}</button>`).join('')}
				<div class="foot">Concept by <a href="https://junesforge.com" target="_top">Junesforge</a></div>
			</aside>
			<main class="main">
				<div class="top">
					<div><h1>${S.view === 'today' ? `${greet}, ${esc(S.name)}` : NAV.find((n) => n[0] === S.view)[1]}</h1><div class="date">${new Date().toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long' })}</div></div>
					<span class="grow"></span>
					<label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input placeholder="Search orders or stock" aria-label="Search" /></label>
					<button class="btn btn-sun" data-neworder>+ New order</button>
				</div>
				${VIEWS[S.view]()}
			</main>
		</div>`;
	}

	const orderRow = (o) => `<div class="ord"><span class="id">#${o.id}</span><div class="items"><b>${esc(summarise(o.items))}</b><span>${o.channel} · ${fmtTime(o.at)}</span></div><span class="amt">${rupees(total(o))}</span><button class="pill" data-s="${o.status}" data-advance="${o.id}" ${o.status === 'Picked up' ? 'disabled' : `aria-label="Order ${o.id}: ${o.status}. Move to ${FLOW[FLOW.indexOf(o.status) + 1]}"`}>${o.status}</button></div>`;
	const lowCard = () => {
		const low = lowItems();
		return `<section class="card"><div class="card-h"><h2>Running low</h2><span>${low.length ? `${low.length} items` : 'All good'}</span></div>
			${low.length ? low.map((s) => `<div class="low ${S.reordered[s.name] ? 'done' : ''}"><div class="t"><b>${esc(s.name)}</b><span>${S.reordered[s.name] ? 'Reorder sent to supplier' : `${s.qty} ${s.unit} left, warn at ${s.min}`}</span></div>${S.reordered[s.name] ? '' : `<button class="btn btn-line btn-sm" data-reorder="${esc(s.name)}">Reorder</button>`}</div>`).join('') : '<div class="okmsg">Nothing is below its line. Nice.</div>'}</section>`;
	};
	const prepCard = (all) => {
		const list = prepList();
		const done = list.filter((p) => S.prepDone[p]).length;
		const shown = all ? list : list.slice(0, 6);
		return `<section class="card"><div class="card-h"><h2>Prep list</h2><span>${done} of ${list.length} done</span></div>
			<div style="padding-top:12px"><div class="prog"><i style="width:${list.length ? (done / list.length) * 100 : 0}%"></i></div></div>
			<div style="padding:6px 0 8px">${shown.map((p) => `<label class="prep ${S.prepDone[p] ? 'done' : ''}"><input type="checkbox" data-prep="${esc(p)}" ${S.prepDone[p] ? 'checked' : ''} /><span class="t">${esc(p)}</span><small>${STATION(p)}</small></label>`).join('')}</div></section>`;
	};

	const VIEWS = {
		today() {
			const rev = S.orders.reduce((a, o) => a + total(o), 0);
			const active = S.orders.filter((o) => o.status !== 'Picked up').length;
			const low = lowItems().filter((s) => !S.reordered[s.name]).length;
			const max = Math.max(...S.hours);
			const startH = 9;
			const nowIdx = Math.min(11, Math.max(0, new Date().getHours() - startH));
			return `<div class="kpis">
				<div class="kpi"><span>Orders today</span><b>${S.orders.length}</b><small class="up">▲ 12% on last ${new Date().toLocaleDateString('en-IN', { weekday: 'long' })}</small></div>
				<div class="kpi"><span>Revenue</span><b>${rupees(rev)}</b><small class="up">▲ ${rupees(rev * 0.08)}</small></div>
				<div class="kpi"><span>In the kitchen</span><b>${active}</b><small style="color:var(--muted)">avg 14 min to ready</small></div>
				<div class="kpi ${low ? 'alert' : ''}"><span>Running low</span><b>${low}</b><small class="${low ? 'dn' : 'up'}">${low ? 'needs a reorder' : 'all stocked'}</small></div>
			</div>
			<div class="grid">
				<div class="col">
					<section class="card"><div class="card-h"><h2>Live orders</h2><span>Tap a status to move it on</span></div>${S.orders.slice(0, 7).map(orderRow).join('')}</section>
					<section class="card"><div class="card-h"><h2>Orders by hour</h2><span>Busiest at 1 pm and 6 pm</span></div>
						<div class="chart">${S.hours.map((v, k) => `<div class="${k === nowIdx ? 'now' : ''}"><i style="height:${(v / max) * 100}%"></i><span>${((startH + k - 1) % 12) + 1}</span></div>`).join('')}</div></section>
				</div>
				<div class="col">${lowCard()}${prepCard(false)}</div>
			</div>`;
		},
		orders() {
			const fs = ['All', ...FLOW];
			const list = S.filter === 'All' ? S.orders : S.orders.filter((o) => o.status === S.filter);
			return `<div class="filters">${fs.map((f) => `<button class="chip" aria-pressed="${S.filter === f}" data-filter="${f}">${f} · ${f === 'All' ? S.orders.length : S.orders.filter((o) => o.status === f).length}</button>`).join('')}</div>
				<section class="card">${list.length ? list.map(orderRow).join('') : '<div class="okmsg">No orders here right now.</div>'}</section>`;
		},
		stock() {
			return `<section class="card"><div class="st h"><span>Ingredient</span><span>In stock</span><span>Level</span><span style="text-align:right">Status</span></div>
				${S.stock.map((s, k) => { const lo = s.qty <= s.min; const pct = Math.min(100, (s.qty / (s.min * 3)) * 100);
					return `<div class="st"><div><b>${esc(s.name)}</b><div style="font-size:12.5px;color:var(--muted)">warn at ${s.min} ${s.unit}</div></div>${stepper(k, 'qty', s)}<div class="lvl"><i style="width:${pct}%;background:${lo ? 'var(--red)' : 'var(--green)'}"></i></div><span class="badge ${lo ? 'lo' : 'ok'}">${lo ? 'Low' : 'OK'}</span></div>`; }).join('')}</section>`;
		},
		prep() {
			return `<div class="grid"><div class="col">${prepCard(true)}</div><div class="col">${lowCard()}</div></div>`;
		},
		settings() {
			const A = S.alerts;
			return `<div style="max-width:640px">
				<div class="tg"><div class="t"><b>Low-stock alerts</b><span>WhatsApp, the moment anything drops below its line</span></div><button class="sw" role="switch" aria-checked="${A.low}" data-alert="low" aria-label="Low-stock alerts"></button></div>
				<div class="tg"><div class="t"><b>Morning prep list</b><span>Sent at ${A.prepAt}</span></div><button class="sw" role="switch" aria-checked="${A.prep}" data-alert="prep" aria-label="Morning prep list"></button></div>
				<div class="tg"><div class="t"><b>Weekly summary</b><span>Every Monday</span></div><button class="sw" role="switch" aria-checked="${A.weekly}" data-alert="weekly" aria-label="Weekly summary"></button></div>
				<button class="btn btn-line" data-restart style="margin-top:10px">Start onboarding again</button></div>`;
		}
	};

	/* ---------------- events ---------------- */
	function render() { document.body.classList.toggle('in-app', S.mode === 'app'); S.mode === 'ob' ? renderOB() : renderApp(); }

	function demo() {
		Object.assign(S, { name: 'Tandoor Lane', type: 'cloud', menu: MENU.cloud.slice(), custom: [], stock: [] });
		deriveStock();
		openApp();
	}
	function openApp() {
		seedKitchen();
		S.mode = 'app'; S.view = 'today';
		render();
		scrollTo(0, 0);
	}

	root.addEventListener('click', (e) => {
		const el = (sel) => e.target.closest(sel);
		let b;
		if ((b = el('[data-type]'))) { if (S.type !== b.dataset.type) { S.type = b.dataset.type; S.menu = []; S.custom = []; S.stock = []; } root.querySelectorAll('[data-type]').forEach((x) => x.setAttribute('aria-pressed', x === b)); refreshOB(); return; }
		if ((b = el('[data-dish]'))) { const d = b.dataset.dish; S.menu = S.menu.includes(d) ? S.menu.filter((x) => x !== d) : [...S.menu, d]; deriveStock(); renderOB(); return; }
		if ((b = el('[data-custom]'))) { S.custom.splice(+b.dataset.custom, 1); renderOB(); return; }
		if ((b = el('[data-step]'))) {
			const [k, key, d] = b.dataset.step.split('|'); const s = S.stock[+k];
			s[key] = Math.max(0, s[key] + +d);
			if (S.mode === 'app' && s.qty > s.min) delete S.reordered[s.name];
			render(); return;
		}
		if ((b = el('[data-alert]'))) { const k = b.dataset.alert; S.alerts[k] = !S.alerts[k]; b.setAttribute('aria-checked', S.alerts[k]); if (S.mode === 'ob') refreshOB(); return; }
		if (el('[data-next]')) { if (!OB[S.step].ok()) return; if (S.step === OB.length - 1) openApp(); else { S.step++; if (S.step === 2) deriveStock(); renderOB(); } return; }
		if (el('[data-back]')) { S.step--; renderOB(); return; }
		if (el('[data-demo]')) { demo(); return; }
		if ((b = el('[data-view]'))) { S.view = b.dataset.view; renderApp(); return; }
		if ((b = el('[data-filter]'))) { S.filter = b.dataset.filter; renderApp(); return; }
		if ((b = el('[data-advance]'))) {
			const o = S.orders.find((x) => x.id === +b.dataset.advance);
			const i = FLOW.indexOf(o.status);
			if (i < FLOW.length - 1) { o.status = FLOW[i + 1]; renderApp(); toast(`#${o.id} is ${o.status.toLowerCase()}`); }
			return;
		}
		if ((b = el('[data-reorder]'))) { S.reordered[b.dataset.reorder] = true; renderApp(); toast(`Reorder for ${b.dataset.reorder} sent on WhatsApp`); return; }
		if (el('[data-neworder]')) {
			const dishes = [...S.menu, ...S.custom];
			const items = [dishes[Math.floor(Math.random() * dishes.length)], dishes[Math.floor(Math.random() * dishes.length)]];
			S.orders.unshift({ id: S.nextId++, items, channel: 'Counter', at: new Date(), status: 'New' });
			renderApp(); toast(`Order #${S.nextId - 1} added`); return;
		}
		if (el('[data-restart]')) { Object.assign(S, { mode: 'ob', step: 0, name: '', type: null, menu: [], custom: [], stock: [], prepDone: {}, reordered: {} }); render(); }
	});
	root.addEventListener('change', (e) => {
		const p = e.target.closest('[data-prep]');
		if (p) { S.prepDone[p.dataset.prep] = p.checked; renderApp(); }
	});

	let tTimer;
	function toast(msg) {
		const t = document.getElementById('toast');
		t.textContent = msg; t.classList.add('show');
		clearTimeout(tTimer); tTimer = setTimeout(() => t.classList.remove('show'), 2200);
	}

	if (location.hash === '#dashboard') demo(); else render();
})();
</script>
